name: Update flake.lock

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Update lockfile
        run: nix --extra-experimental-features "nix-command flakes" flake update

      - name: Validate updates
        run: nix --extra-experimental-features "nix-command flakes" flake check --print-build-logs

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update flake.lock"
          title: "chore: automated flake.lock update"
          body: |
            Automated lockfile refresh.

            - Ran `nix flake update`
            - Ran `nix flake check`
          branch: automation/update-flake-lock
          labels: dependencies