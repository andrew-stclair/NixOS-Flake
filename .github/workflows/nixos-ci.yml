name: "NixOS Configuration CI Evaluation"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  evaluate-flake:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Run Flake Check
      run: nix flake check

    - name: Evaluate All Configurations
      run: |
        nix eval --json '.#nixosConfigurations' | jq -r 'keys[]' | while read config; do
          echo "Evaluating configuration: $config"
          nix eval ".#nixosConfigurations.$config.config.system.build.toplevel.drvPath"
        done

