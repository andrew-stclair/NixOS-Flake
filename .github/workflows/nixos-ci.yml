name: "NixOS Configuration CI Evaluation"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  get-configurations:
    runs-on: ubuntu-latest
    outputs:
      configurations: ${{ steps.get-configs.outputs.configurations }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Get Configuration Names
      id: get-configs
      run: |
        CONFIGS=$(nix eval --json '.#nixosConfigurations' | jq -r 'keys | .[]' | jq -Rs 'split("\n")[:-1] | join(",")')
        echo "configurations=$CONFIGS" >> "$GITHUB_OUTPUT"

  evaluate-flake:
    needs: get-configurations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: ${{ fromJson(format('[{0}]', needs.get-configurations.outputs.configurations)) }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Run Flake Check
      run: nix flake check

    - name: dry-run Evaluation - ${{ matrix.config }}
      run: |
        nix eval ".#nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel.drvPath"

