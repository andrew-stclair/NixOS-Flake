name: "NixOS Configuration CI Evaluation"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  check-flake:
    name: "Check Flake"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Run Flake Check
      run: nix flake check

  evaluate-configuration:
    name: "Evaluate NixOS Configuration"
    needs: check-flake
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [ "desktop", "server", "test-vm" ]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Evaluate All Configurations
      run: 
        nix eval ".#nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel.drvPath"

