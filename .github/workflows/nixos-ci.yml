name: "NixOS Configuration CI Evaluation"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  evaluate-flake:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Run Flake Check
      run: nix flake check

    - name: dry-run Evaluation - Desktop Host
      run: |
        nix eval .#nixosConfigurations.desktop.config.system.build.toplevel.drvPath

    - name: dry-run Evaluation - Server Host
      run: |
        nix eval .#nixosConfigurations.server.config.system.build.toplevel.drvPath
